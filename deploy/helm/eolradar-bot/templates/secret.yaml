{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eolradar-bot.fullname" . }}
  labels:
    {{- include "eolradar-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  SLACK_SIGNING_SECRET: {{ .Values.secret.data.SLACK_SIGNING_SECRET | quote }}
  SLACK_BOT_TOKEN: {{ .Values.secret.data.SLACK_BOT_TOKEN | quote }}
  SLACK_DIGEST_CHANNEL: {{ .Values.secret.data.SLACK_DIGEST_CHANNEL | quote }}
  SLACK_APP_TOKEN: {{ .Values.secret.data.SLACK_APP_TOKEN | quote }}
{{- end }}
