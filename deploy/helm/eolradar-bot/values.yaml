# Default install is one replica with the Monday digest scheduler on.
# replicaCount must stay 1 while config.digestCron is not "off".

replicaCount: 1

image:
  repository: ghcr.io/fjcruzer/eolradar-bot
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 80

config:
  eolApiBase: https://eolradar.dev
  # memory, file, or sqlite. file and sqlite need persistence.enabled.
  store: memory
  storePath: /data/store.json
  digestServices: all
  # Monday 14:00 UTC, same instant as the Worker cron. "off" disables it.
  digestCron: "0 14 * * MON"
  digestCatchupMinutes: "15"

# Prefer existingSecret over secret.create so tokens are not stored in a values file.
secret:
  create: false
  existingSecret: ""
  data:
    SLACK_SIGNING_SECRET: ""
    SLACK_BOT_TOKEN: ""
    SLACK_DIGEST_CHANNEL: ""
    SLACK_APP_TOKEN: ""

persistence:
  enabled: false
  size: 1Gi
  # Empty uses the cluster default StorageClass.
  storageClassName: ""

ingress:
  enabled: false
  className: nginx
  host: eol.example.com
  path: /

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
