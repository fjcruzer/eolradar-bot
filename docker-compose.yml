# Self-hosted EOL Radar bot.
# Copy .env.example to .env and fill in the Slack values. The env file is
# optional, so the container can still start and serve /healthz.
# Requires Docker Compose v2.24 or newer (env_file.required).

services:
  eolradar-bot:
    image: ghcr.io/fjcruzer/eolradar-bot:latest
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      HOME: /tmp
      STORE: file
      STORE_PATH: /data/store.json
    volumes:
      - eolradar-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

volumes:
  eolradar-data:
